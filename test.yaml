#   BUILD_WITH_CONTAINER=1 make shell 
#   bazel build --config=libc++ --config=release //src/envoy:envoy
#   ./envoy -c test.yaml
#   curl -v -X POST -H "Cookie: sessionid=123" --data-binary '<b>188</b>' http://127.0.0.1:10000
node:  
  id: test-node  
  cluster: test-cluster  
admin:  
  access_log_path: /dev/null  
  address:  
    socket_address:  
      address: 127.0.0.1  
      port_value: 9901  
static_resources:  
  listeners:  
  - name: listener_0  
    address:  
      socket_address:  
        address: 127.0.0.1  
        port_value: 10000  
    filter_chains:  
    - filters:  
      - name: envoy.filters.network.http_connection_manager  
        typed_config:  
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager  
          stat_prefix: ingress_http  
          codec_type: AUTO  
          route_config:  
            name: local_route  
            virtual_hosts:  
            - name: local_service  
              domains: ["*"]  
              routes:  
              - match:  
                  prefix: "/"  
                direct_response:  
                  status: 200  
                  body:  
                    inline_string: "hello, world!"  
          http_filters:  
          - name: envoy.filters.http.simple_filter  
            typed_config:  
              "@type": type.googleapis.com/simple_filter.SimpleFilterConfig  
          - name: envoy.filters.http.router  
            typed_config:  
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:  
  - name: local_cluster  
    connect_timeout: 5s  
    type: STATIC  
    load_assignment:  
      cluster_name: local_cluster  
      endpoints:  
      - lb_endpoints:  
        - endpoint:  
            address:  
              socket_address:  
                address: 127.0.0.1  
                port_value: 10001